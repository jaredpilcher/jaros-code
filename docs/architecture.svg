<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7aa2f7"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ece6a"/>
    </marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e0af68"/>
    </marker>
  </defs>

  <rect width="900" height="470" rx="10" fill="#0d1117"/>
  <text x="32" y="42" fill="#c0caf5" font-size="22" font-weight="700">jaros-code</text>
  <text x="172" y="42" fill="#565f89" font-size="14">multi-model coding agents · every call local on a Jetson · $0 inference</text>
  <line x1="32" y1="58" x2="868" y2="58" stroke="#21262d" stroke-width="1"/>

  <!-- you -->
  <text x="32" y="150" fill="#565f89" font-size="12">you</text>
  <rect x="28" y="158" width="150" height="54" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="103" y="182" fill="#c0caf5" font-size="12" text-anchor="middle">"fix the off-by-one</text>
  <text x="103" y="199" fill="#c0caf5" font-size="12" text-anchor="middle">in foo.py"</text>

  <!-- DETERMINISTIC layer band -->
  <rect x="208" y="92" width="300" height="300" rx="10" fill="#0f1620" stroke="#1f2a3a" stroke-dasharray="4 3"/>
  <text x="224" y="110" fill="#7aa2f7" font-size="11" font-weight="700">DETERMINISTIC  (no model — AST · features · failure-signal)</text>

  <!-- router -->
  <rect x="228" y="124" width="260" height="74" rx="8" fill="#161b22" stroke="#7aa2f7"/>
  <text x="244" y="146" fill="#7aa2f7" font-size="13" font-weight="700">ROUTER</text>
  <text x="244" y="166" fill="#9aa5ce" font-size="11">classify → problem class</text>
  <text x="244" y="182" fill="#9aa5ce" font-size="11">tally → best fitting model for class</text>

  <!-- rewire -->
  <rect x="228" y="216" width="260" height="64" rx="8" fill="#161b22" stroke="#7aa2f7"/>
  <text x="244" y="238" fill="#7aa2f7" font-size="13" font-weight="700">REWIRE  (clerk)</text>
  <text x="244" y="258" fill="#9aa5ce" font-size="11">serve chosen model · activate its</text>
  <text x="244" y="272" fill="#9aa5ce" font-size="11">prompts + tools</text>

  <!-- log -->
  <rect x="228" y="300" width="260" height="74" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="244" y="322" fill="#c0caf5" font-size="13" font-weight="700">HASH-CHAIN LOG</text>
  <text x="244" y="342" fill="#9aa5ce" font-size="11">every Decision + tool effect →</text>
  <text x="244" y="358" fill="#9aa5ce" font-size="11">byte-replayable · 0 model calls</text>

  <!-- TWO-PLANE solve band -->
  <rect x="540" y="92" width="232" height="300" rx="10" fill="#0f1d14" stroke="#1f3a26" stroke-dasharray="4 3"/>
  <text x="556" y="110" fill="#9ece6a" font-size="11" font-weight="700">TWO-PLANE SOLVE</text>

  <rect x="556" y="124" width="200" height="40" rx="8" fill="#161b22" stroke="#9ece6a"/>
  <text x="656" y="149" fill="#9ece6a" font-size="12" text-anchor="middle">model → inert Decision</text>

  <rect x="556" y="184" width="200" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="656" y="209" fill="#c0caf5" font-size="12" text-anchor="middle">gate / validate()</text>

  <rect x="556" y="244" width="200" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="656" y="269" fill="#c0caf5" font-size="12" text-anchor="middle">tool.execute() — effect</text>

  <rect x="556" y="304" width="200" height="40" rx="8" fill="#161b22" stroke="#e0af68"/>
  <text x="656" y="329" fill="#e0af68" font-size="12" text-anchor="middle">TEST GATE — pass?</text>

  <!-- jetson -->
  <rect x="788" y="150" width="100" height="190" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="838" y="172" fill="#565f89" font-size="10" text-anchor="middle">JETSON</text>
  <text x="838" y="186" fill="#565f89" font-size="10" text-anchor="middle">7.3 GB</text>
  <rect x="802" y="198" width="72" height="58" rx="6" fill="#0d1117" stroke="#7aa2f7"/>
  <text x="838" y="222" fill="#7aa2f7" font-size="10" text-anchor="middle">llama.cpp</text>
  <text x="838" y="238" fill="#9aa5ce" font-size="9" text-anchor="middle">model</text>
  <text x="838" y="249" fill="#9aa5ce" font-size="9" text-anchor="middle">swaps</text>
  <text x="838" y="284" fill="#565f89" font-size="9" text-anchor="middle">gemma·qwen2.5</text>
  <text x="838" y="296" fill="#565f89" font-size="9" text-anchor="middle">qwen3-think</text>

  <!-- flows -->
  <line x1="178" y1="185" x2="226" y2="161" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="358" y1="198" x2="358" y2="214" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="488" y1="248" x2="554" y2="210" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="786" y1="245" x2="758" y2="245" stroke="#7aa2f7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="690" y="180" fill="#565f89" font-size="9">swap on demand</text>

  <!-- two-plane internal loop -->
  <line x1="656" y1="164" x2="656" y2="182" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="656" y1="224" x2="656" y2="242" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="656" y1="284" x2="656" y2="302" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <!-- observe back up -->
  <path d="M556,324 C520,324 520,144 554,144" fill="none" stroke="#9ece6a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrowG)"/>
  <text x="500" y="238" fill="#565f89" font-size="9" transform="rotate(-90 500 238)">observe (test result)</text>

  <!-- pass to log -->
  <path d="M656,344 C656,372 420,372 358,374" fill="none" stroke="#9ece6a" stroke-width="1.4" marker-end="url(#arrowG)"/>
  <text x="470" y="388" fill="#9ece6a" font-size="10">pass → log + done</text>

  <!-- escalate -->
  <path d="M756,324 C840,324 858,392 656,408 C420,420 300,418 488,408" fill="none" stroke="#e0af68" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrowO)"/>
  <text x="556" y="430" fill="#e0af68" font-size="10" text-anchor="middle">fail → ESCALATE to a stronger fitting model (never the cloud)</text>

  <text x="32" y="452" fill="#565f89" font-size="10">request → deterministic routing → rewire → two-plane solve → test-gate → replayable log · scaffold multiplies the base model</text>
</svg>
