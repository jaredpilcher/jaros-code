[pytest]
# Scope collection to the project's test suite. Without this, a root `pytest` run also descends
# into gitignored runtime dirs (e.g. logs/, .jaros-data/repos/) where SWE-bench grind artifacts and
# vendored repo checkouts carry their own configs/conftests; those leak --doctest-glob and get a
# stray file like logs/.../test_output.txt collected as a failing doctest (NameError: np) — false
# "1 failed" noise that masks real regressions and nearly blocked a commit gate. testpaths keeps
# collection to tests/ (verified: 1098 real tests, drops only the stray artifact).
testpaths = tests
